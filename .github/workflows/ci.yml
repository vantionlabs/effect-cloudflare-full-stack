name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      # The same image as compose.yaml, pinned to match PlanetScale (18.x / pgvector 0.8.5), so
      # tests run against real pgvector and the real Dutch stemmer rather than a stand-in.
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: effect_ai
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: effect_ai
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U effect_ai -d effect_ai"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Assembled from parts rather than written as a literal URL: secretlint's
      # connection-string rule cannot tell a throwaway CI credential from a real one, and
      # the rule is worth keeping armed across the whole repo.
      PGUSER: effect_ai
      PGPASSWORD: ci_only
      PGDATABASE: effect_ai
      PGPORT: "55433"
      # Auth tests boot a real Worker, so the secret must be present. A throwaway value is
      # correct here: CI has no real sessions to protect, and a committed secret would be worse.
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BASE_URL: http://localhost:8799
      # Job-level so the `if:` conditions below can test it. `secrets.*` is not available in an
      # `if:` on a step, but `env.*` is.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          # Reads .bun-version, so CI and local development cannot drift.
          bun-version-file: .bun-version

      # wrangler and vitest's worker project spawn workerd, and both are Node-targeted.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # MUST precede `check`, and this is not an optimisation.
      #
      # `apps/console/src/routeTree.gen.ts` is generated by the TanStack router Vite plugin and is
      # gitignored, but `tsc -b` needs it: without it `main.tsx` cannot resolve the module and every
      # `createFileRoute` argument narrows to `undefined`. It exists on a developer's disk as a
      # by-product of having run `vite` once, so `bun run check` passes locally and fails in CI — and
      # equally in any fresh clone. The only supported generator in this repo is the plugin, so the
      # build is how it gets made.
      #
      # It also produces the `dist/` the Pages deploy uploads, so building here is not wasted work.
      - name: Build the console (generates the route tree `check` depends on)
        run: bun run --filter @ea/console build

      - name: Compose the Hyperdrive local connection string
        run: |
          echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres""ql://$PGUSER:$PGPASSWORD@localhost:$PGPORT/$PGDATABASE" >> "$GITHUB_ENV"

      # Kept as separate steps rather than one `preflight` so a failure names itself in the
      # Actions UI instead of hiding inside a composite script.
      - run: bun run format:check
      - run: bun run check
      - run: bun run lint
      - run: bun run hygiene

      # Everything that runs on a local runtime.
      - name: Test (local runtimes)
        run: bun run test --project domain --project tables --project evals --project console

      # The `worker` project is separate because it CANNOT run locally.
      #
      # It boots a real Worker from apps/worker/wrangler.jsonc, and that config has an `ai` binding.
      # Workers AI has no local emulation, so wrangler starts a REMOTE runtime and refuses without
      # `CLOUDFLARE_API_TOKEN` — "in a non-interactive environment, it's necessary to set a
      # CLOUDFLARE_API_TOKEN". It passes on a developer machine only because `wrangler login` cached
      # OAuth credentials there, which is a third way this suite was green locally and red here.
      #
      # Gated on the secret rather than made conditional in the test file: a suite that silently
      # skips itself is worse than one that visibly does not run, and the step below says so out loud.
      - name: Test (real Worker — needs a remote runtime for the AI binding)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run test --project worker

      - name: Say so when the real-Worker suite did not run
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning title=worker suite skipped::CLOUDFLARE_API_TOKEN is not set, so the \
          real-Worker tests (auth, sessions, the origin allowlist) did NOT run. They need a remote \
          runtime because the AI binding has no local emulation. Add the secret to run them."

      # The retrieval gate. Separate from `test` because it is a THRESHOLD, not an assertion: it can
      # regress without any test failing, and a decide pipeline built on retrieval that cannot find
      # the applicable clause produces a review queue full of needs_human with nothing to explain why.
      #
      # Needs Workers AI credentials for the same reason the worker suite needs a token: the semantic
      # half is a real embedding call. The harness now REFUSES to print a hybrid number when the
      # embeddings did not land, rather than reporting lexical recall under a semantic label — so
      # running it without credentials would fail on that refusal, not on retrieval quality, which
      # would be a confusing way to be red.
      - name: Retrieval gate
        if: ${{ env.CLOUDFLARE_AI_TOKEN != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: bun run evals:retrieval

      - name: Say so when the retrieval gate did not run
        if: ${{ env.CLOUDFLARE_AI_TOKEN == '' }}
        run: |
          echo "::warning title=retrieval gate skipped::CLOUDFLARE_AI_TOKEN is not set, so retrieval \
          recall was NOT measured. The decide pipeline's quality rests on this number; a queue full \
          of needs_human will not tell you retrieval is why."
