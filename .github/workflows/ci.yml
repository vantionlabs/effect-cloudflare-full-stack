name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    services:
      # The same image as compose.yaml, pinned to match PlanetScale (18.x / pgvector 0.8.5), so
      # tests run against real pgvector and the real Dutch stemmer rather than a stand-in.
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: effect_ai
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: effect_ai
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U effect_ai -d effect_ai"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Assembled from parts rather than written as a literal URL: secretlint's
      # connection-string rule cannot tell a throwaway CI credential from a real one, and
      # the rule is worth keeping armed across the whole repo.
      PGUSER: effect_ai
      PGPASSWORD: ci_only
      PGDATABASE: effect_ai
      PGPORT: "55433"
      # Auth tests boot a real Worker, so the secret must be present. A throwaway value is
      # correct here: CI has no real sessions to protect, and a committed secret would be worse.
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BASE_URL: http://localhost:8799
      # Job-level so the `if:` conditions below can test it. `secrets.*` is not available in an
      # `if:` on a step, but `env.*` is.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          # Reads .bun-version, so CI and local development cannot drift.
          bun-version-file: .bun-version

      # wrangler and vitest's worker project spawn workerd, and both are Node-targeted.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # MUST precede `check`, and this is not an optimisation.
      #
      # `apps/console/src/routeTree.gen.ts` is generated by the TanStack router Vite plugin and is
      # gitignored, but `tsc -b` needs it: without it `main.tsx` cannot resolve the module and every
      # `createFileRoute` argument narrows to `undefined`. It exists on a developer's disk as a
      # by-product of having run `vite` once, so `bun run check` passes locally and fails in CI — and
      # equally in any fresh clone. The only supported generator in this repo is the plugin, so the
      # build is how it gets made.
      #
      # It also produces the `dist/` the Pages deploy uploads, so building here is not wasted work.
      - name: Build the console (generates the route tree `check` depends on)
        # The invocation is `cd` rather than `--filter`, and the diagnostics are not decoration.
        #
        # `bun run --filter @ea/console build` failed here with a bare `error: FileNotFound`, 30 ms
        # into the step, before vite printed a line (run 36713531511). bun's own filter errors name
        # what they could not find ("Script ... not found", "No workspace packages matched"), and a
        # child's output is always prefixed with the package name, so that bare string is bun failing
        # to open a file it did not name. It reproduces NOWHERE: not on macOS, not in a Linux
        # container on the same bun build and the same 761 packages, not from a fresh clone of this
        # remote, not with these environment variables set. The same step passed on the previous
        # commit, so `--filter` is not broken on the runner either.
        #
        # So the filter machinery is removed from the path, and if the bare error returns it is vite's
        # and the diagnostics below say which file. Do not quietly delete this block: it is the only
        # record of a failure that a green local run cannot rule out.
        run: |
          if ! (cd apps/console && bun run build); then
            echo "::group::console build failed — diagnostics"
            bun --version && bun --revision
            ls -la apps/console apps/console/src | head -40
            bun pm ls | head -30
            echo "::endgroup::"
            exit 1
          fi

      - name: Compose the Hyperdrive local connection string
        run: |
          URL="postgres""ql://$PGUSER:$PGPASSWORD@localhost:$PGPORT/$PGDATABASE"
          echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=$URL" >> "$GITHUB_ENV"
          # The second Hyperdrive binding needs its own local string or the harness refuses to start.
          # Same container: locally there is no Hyperdrive and no caching (ADR-0002).
          echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_CACHED=$URL" >> "$GITHUB_ENV"

      # Kept as separate steps rather than one `preflight` so a failure names itself in the
      # Actions UI instead of hiding inside a composite script.
      - run: bun run format:check
      - run: bun run check
      - run: bun run lint
      - run: bun run hygiene

      # Everything that runs on a local runtime.
      - name: Test (local runtimes)
        run: bun run test --project domain --project tables --project evals --project console

      # The `worker` project is separate because it CANNOT run locally.
      #
      # It boots a real Worker from apps/worker/wrangler.jsonc, and that config has an `ai` binding.
      # Workers AI has no local emulation, so wrangler starts a REMOTE runtime and refuses without
      # `CLOUDFLARE_API_TOKEN` — "in a non-interactive environment, it's necessary to set a
      # CLOUDFLARE_API_TOKEN". It passes on a developer machine only because `wrangler login` cached
      # OAuth credentials there, which is a third way this suite was green locally and red here.
      #
      # Gated on the secret rather than made conditional in the test file: a suite that silently
      # skips itself is worse than one that visibly does not run, and the step below says so out loud.
      # The Worker reads its config from its OWN environment, not from this job's.
      #
      # `ConfigProvider.fromEnvRecord(env)` means "env" is the Worker's bindings — wrangler.jsonc vars plus
      # apps/worker/.env — and `createTestHarness` does not read this process's variables. So a secret
      # exported to the step is invisible to the code under test, and `Config.Redacted("CLOUDFLARE_AI_TOKEN")`
      # (deliberately undefaulted, so a missing token fails loudly rather than silently falling back to the
      # deterministic embedder) dies with `ConfigError: Expected string at ["CLOUDFLARE_AI_TOKEN"]`.
      #
      # That took three CI rounds to find, because the symptom is 70 failing tests rather than a missing
      # variable. The e2e job has written this file all along, which is why only this job was affected —
      # until the same omission was found there too.
      - name: Write the Worker's own environment
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          echo "CLOUDFLARE_AI_TOKEN=$CLOUDFLARE_AI_TOKEN" >> apps/worker/.env

      - name: Test (real Worker — needs a remote runtime for the AI binding)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run test --project worker

      - name: Say so when the real-Worker suite did not run
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning title=worker suite skipped::CLOUDFLARE_API_TOKEN is not set, so the real-Worker tests (auth, sessions, the origin allowlist) did NOT run. They need a remote runtime because the AI binding has no local emulation. Add the secret to run them."

      # The retrieval gate. Separate from `test` because it is a THRESHOLD, not an assertion: it can
      # regress without any test failing, and a decide pipeline built on retrieval that cannot find
      # the applicable clause produces a review queue full of needs_human with nothing to explain why.
      #
      # Needs Workers AI credentials for the same reason the worker suite needs a token: the semantic
      # half is a real embedding call. The harness now REFUSES to print a hybrid number when the
      # embeddings did not land, rather than reporting lexical recall under a semantic label — so
      # running it without credentials would fail on that refusal, not on retrieval quality, which
      # would be a confusing way to be red.
      - name: Retrieval gate
        if: ${{ env.CLOUDFLARE_AI_TOKEN != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: bun run evals:retrieval

      - name: Say so when the retrieval gate did not run
        if: ${{ env.CLOUDFLARE_AI_TOKEN == '' }}
        run: |
          echo "::warning title=retrieval gate skipped::CLOUDFLARE_AI_TOKEN is not set, so retrieval recall was NOT measured. The decide pipeline's quality rests on this number; a queue full of needs_human will not tell you retrieval is why."

  # The browser tier. A SEPARATE job, and gated, for the same reason the `worker` vitest project is.
  #
  # It boots the console's dev server, which boots the API as an auxiliary Worker, and the API has an `ai`
  # binding that Workers AI cannot emulate locally — so wrangler starts a REMOTE runtime and refuses without
  # a token. Nothing in the suite touches a model; the binding merely has to exist.
  #
  # Separate rather than more steps on `preflight` so a red e2e run names itself, and so it cannot slow the
  # gate everybody waits on.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_USER: effect_ai
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: effect_ai
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U effect_ai -d effect_ai"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGUSER: effect_ai
      PGPASSWORD: ci_only
      PGDATABASE: effect_ai
      PGPORT: "55433"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Say so when the browser suite cannot run
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning title=e2e skipped::CLOUDFLARE_API_TOKEN is not set, so the browser tests (the guest redirect, sign-in, sign-out, and the assertion that no session token reaches the page) did NOT run. They boot the API, whose AI binding has no local emulation. Add the secret to run them."

      - if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bun install --frozen-lockfile

      # Chromium only, matching playwright.config.ts. `--with-deps` installs the system libraries
      # a headless browser needs on a bare runner.
      - name: Install Chromium
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      # The API reads its local configuration from this file, exactly as a developer's machine does.
      #
      # BASE_URL is the load-bearing line. Without the file, wrangler falls back to the `vars` in
      # wrangler.jsonc, whose BASE_URL is the deployed **https** console — and `useSecureCookies` is derived
      # from that scheme, so every session cookie would come back marked `Secure`, be discarded by the
      # browser over plain http, and every sign-in would appear to succeed while signing nobody in.
      - name: Write the API's local environment
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          URL="postgres""ql://$PGUSER:$PGPASSWORD@localhost:$PGPORT/$PGDATABASE"
          {
            echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=$URL"
            echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_CACHED=$URL"
            echo "BETTER_AUTH_SECRET=ci-only-secret-at-least-32-characters-long"
            echo "BASE_URL=http://localhost:5173"
            # Undefaulted on purpose in the adapters, so its absence is a layer-build defect rather than a
            # silent fall back to the deterministic embedder. Missing here meant the API died on its first
            # request, the console's SSR never returned 2xx, and Playwright reported it as
            # "Timed out waiting 120000ms from config.webServer" — a web-server symptom for a credential cause.
            echo "CLOUDFLARE_AI_TOKEN=$CLOUDFLARE_AI_TOKEN"
          } >> apps/worker/.env
          echo "CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=$URL" >> "$GITHUB_ENV"

      # The schema has to exist before anything signs up. The suite does not migrate: a test that quietly
      # creates the tables it needs hides a broken migration.
      - name: Migrate
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bun run db:migrate

      # The route tree is generated by the vite plugin and gitignored, so the dev server would be the thing
      # generating it — building first keeps a compile error from surfacing as a Playwright timeout.
      - name: Build the console
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bun run --filter @ea/console build

      - name: Test (browser)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run test:e2e

      # Traces are kept only for failures (see playwright.config.ts), so this uploads nothing on a green run.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
