name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Production can also be released deliberately, decoupled from a merge.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

# Deploys are serialised and never cancelled: interrupting a half-applied deploy is worse
# than waiting for the previous one.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # Every green main lands on staging automatically. Production is a separate, gated step,
  # so "merged" and "released" stay distinct.
  staging:
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # wrangler is Node-targeted, as are the vitest worker project and Pulumi's language host.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      - name: Deploy to staging
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --var VERSION surfaces the deployed commit on /api/v1/health, so a response can
          # always be traced back to a specific build.
          bunx wrangler deploy --env staging \
            --var VERSION:"${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Smoke test
        run: ./.github/scripts/smoke.sh "${{ vars.STAGING_URL }}"

  production:
    # Never automatic. A human dispatches it, and the `production` GitHub environment can
    # require a reviewer on top.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      - name: Deploy to production
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --env production --var VERSION:"${{ github.sha }}"

      - name: Smoke test
        run: ./.github/scripts/smoke.sh "${{ vars.PRODUCTION_URL }}"
