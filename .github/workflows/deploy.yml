name: Deploy

# Two artifacts, one pipeline, in a fixed order — which is the whole reason this is GitHub Actions and
# not Pages' own Git integration.
#
# Cloudflare Pages Git integration could not be used even if we wanted it: the project was created as a
# Direct Upload project, and the docs are explicit that "if you choose Direct Upload, you cannot switch to
# Git integration later." But it would be the wrong tool regardless. Pages Builds can deploy the Pages
# project and nothing else, whereas a change here usually touches the Worker and the console together, and
# the console's `/api/*` proxy calls the Worker over a service binding. Deploying the console first would
# serve a console against an API that has not shipped yet. And Pages Builds runs a build command, not a
# gate: it cannot refuse a deploy because a tenancy boundary was violated or the auth schema drifted, which
# is what `bun run hygiene` is for. See docs/adr/0001 and docs/services.md.
#
# Environment map. Each has its OWN Neon project, R2 bucket, queue, DLQ and KV namespace — nothing is
# shared, because a staging migration must not alter production's tables and a staging replay of a fixture
# invoice must not collide with production's `decide_key` unique constraint.
#
#   main       → staging      automatic, on green CI   effect-ai-staging   staging.<project>.pages.dev
#   <dispatch> → production   a human promotes a SHA   effect-ai           <project>.pages.dev
#   by hand    → dev          a sandbox               effect-ai-dev       no console
#
# Production is the TOP-LEVEL wrangler configuration, so it deploys with no `--env`. That is deliberate:
# the top level is what a bare `wrangler deploy` ships, and the environment most costly to ship by accident
# should be the one you cannot reach by forgetting a flag — you reach it by asking for it here.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

# Deploys are serialised and never cancelled: interrupting a half-applied deploy is worse
# than waiting for the previous one.
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  # `env.dev` is never deployed by CI — it is the REMOTE target for `wrangler dev --remote --env dev` (AGENTS.md) —
  # but its database still has to match the code, or a remote session hits a schema from three migrations ago.
  # So it is migrated whenever staging is, in its own GitHub environment with its own `DATABASE_URL`.
  dev-schema:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The schema BEFORE the code, every deploy. Expand first: a migration must work with the code that is
      # still running until the next step replaces it, which holds because every migration here is additive and
      # `if not exists`. `db:migrate` then reads back `effect_sql_migrations` and FAILS unless the database holds
      # every migration this build's manifest names — staging and production sat at 15 of 25 behind green deploys
      # because nothing compared the two (.scratch/deploy-migrations/issues/01).
      #
      # `DATABASE_URL` is this GitHub environment's own secret: the Neon project's DIRECT (non-pooler)
      # connection string. Absent is a failure, never a skip — a deploy that silently skips migrating is the bug.
      - name: Migrate the database (dev)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set for the 'dev' environment. Add the Neon project's direct connection string as an environment secret. Refusing to deploy code ahead of its schema."
            exit 1
          fi
          bun run db:migrate

  staging:
    # Every green main lands here. Nothing else does.
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # wrangler is Node-targeted, as are the vitest worker project and Pulumi's language host.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      # The API first, always. The console's `functions/api/[[path]].ts` reaches the Worker over a
      # service binding, so shipping the console against an older API is the one ordering that can
      # serve a broken app; the reverse merely serves an older console against a newer API.
      # The schema BEFORE the code, every deploy. Expand first: a migration must work with the code that is
      # still running until the next step replaces it, which holds because every migration here is additive and
      # `if not exists`. `db:migrate` then reads back `effect_sql_migrations` and FAILS unless the database holds
      # every migration this build's manifest names — staging and production sat at 15 of 25 behind green deploys
      # because nothing compared the two (.scratch/deploy-migrations/issues/01).
      #
      # `DATABASE_URL` is this GitHub environment's own secret: the Neon project's DIRECT (non-pooler)
      # connection string. Absent is a failure, never a skip — a deploy that silently skips migrating is the bug.
      - name: Migrate the database (staging)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set for the 'staging' environment. Add the Neon project's direct connection string as an environment secret. Refusing to deploy code ahead of its schema."
            exit 1
          fi
          bun run db:migrate

      - name: Deploy the Worker (staging)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --var VERSION surfaces the deployed commit on /api/v1/health, so a response can always be
          # traced back to a specific build.
          bunx wrangler deploy --env staging \
            --var VERSION:"${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Build the console
        # The environment is chosen HERE, not at deploy time — see the deploy step below for why.
        env:
          CLOUDFLARE_ENV: staging
        run: bun run --filter @ea/console build

      # A WORKER now, not a Pages project: the console runs TanStack Start and server-renders, which
      # static assets cannot do. The build names it `effect-ai-console-staging`, and its own service
      # binding points at `effect-ai-staging` so staging's console talks to staging's API.
      # `CLOUDFLARE_ENV` on the BUILD, and no `--env` on the deploy. The first staging deploy proved why.
      #
      # `@cloudflare/vite-plugin` emits its own wrangler config plus a `.wrangler/deploy/config.json`
      # redirect, so `wrangler deploy` follows the redirect — it logs "Using redirected Wrangler
      # configuration" — and the GENERATED config is already flattened for whatever environment the build
      # chose. `--env staging` then has no environment block to find, so it is silently a no-op:
      #
      #   built with no env      name: effect-ai-console          services: API -> effect-ai
      #   built CLOUDFLARE_ENV=staging   name: effect-ai-console-staging  services: API -> effect-ai-staging
      #
      # The first form is what the first staging deploy shipped: the PRODUCTION name, bound to the
      # PRODUCTION API. `wrangler.jsonc` warns about exactly that — "staging's console must reach STAGING's
      # API, and inheriting would silently point it at production" — and the build defeated the warning by
      # flattening the config before wrangler saw the flag.
      - name: Deploy the console (staging)
        working-directory: apps/console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      # Through the Pages origin, not the Worker's own hostname: that is the path a browser takes,
      # and it is the only one that exercises the service-binding proxy.
      - name: Smoke test
        run: ./.github/scripts/smoke.sh "https://effect-ai-console-staging.ishak-f45.workers.dev"

  production:
    # Never automatic. A human dispatches it, and the `production` GitHub environment can require a
    # reviewer on top. Merging and releasing stay separate decisions.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      # The schema BEFORE the code, every deploy. Expand first: a migration must work with the code that is
      # still running until the next step replaces it, which holds because every migration here is additive and
      # `if not exists`. `db:migrate` then reads back `effect_sql_migrations` and FAILS unless the database holds
      # every migration this build's manifest names — staging and production sat at 15 of 25 behind green deploys
      # because nothing compared the two (.scratch/deploy-migrations/issues/01).
      #
      # `DATABASE_URL` is this GitHub environment's own secret: the Neon project's DIRECT (non-pooler)
      # connection string. Absent is a failure, never a skip — a deploy that silently skips migrating is the bug.
      - name: Migrate the database (production)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set for the 'production' environment. Add the Neon project's direct connection string as an environment secret. Refusing to deploy code ahead of its schema."
            exit 1
          fi
          bun run db:migrate

      - name: Deploy the Worker (production)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # No `--env`: production IS the top-level configuration.
        run: bunx wrangler deploy --var VERSION:"${{ github.sha }}"

      - name: Build the console
        run: bun run --filter @ea/console build

      # No `--env`: production IS the top-level configuration, for the console as for the API.
      - name: Deploy the console (production)
        working-directory: apps/console
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy

      - name: Smoke test
        run: ./.github/scripts/smoke.sh "https://effect-ai-console.ishak-f45.workers.dev"
