name: effect-ai
runtime:
  name: nodejs
  options:
    # Bun is the repo's package manager, but Pulumi's language host is Node-targeted —
    # the same split as wrangler and the vitest worker project.
    packagemanager: npm
    # `typescript: false` disables Pulumi's vendored ts-node@7.0.1, which is ancient and
    # crashes on modern Node ("Cannot read properties of undefined (reading 'readFile')").
    # Node 23+ strips types natively, so the .ts entry point runs without any transpiler.
    typescript: false
    entrypoint: index.ts
description: Cloudflare infrastructure for effect-ai

# Keys here are namespaced to the project automatically, so `accountId` is read as
# `effect-ai:accountId`. Provider credentials (cloudflare:apiToken) are deliberately NOT
# declared here — they are set per stack, so a token never lands in a committed file.
config:
  accountId:
    type: string
    description: Cloudflare account id

# `postgresUrl` used to be declared here, as a secret, for the Hyperdrive origins. Those are no longer
# managed by this program (see index.ts for why — the origin password cannot be read back, so any declaration
# either shows a permanent false diff or overwrites the live password on every `up`).
#
# So this program now holds NO secrets at all, which is worth noticing: the stack's passphrase protects
# nothing, and the connection string lives in exactly one place — apps/worker/.env, gitignored, read by
# `db:verify`, `db:migrate` and `wrangler dev` alike. One copy beats two that can disagree.
